<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Source for images/og-image.jpg (the link preview card). Not deployed (see .vercelignore). -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--accent:#9B1B30;--bg:#FAF5F0;--ink:#2B1A14;--muted:#6B4E40;--line:#CDAE9A}
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;background:var(--bg);overflow:hidden}
  .card{position:relative;display:flex;width:1200px;height:630px;padding:44px 44px 44px 72px;gap:48px}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--accent)}
  .text{flex:1;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font:700 18px/1 'DM Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;white-space:nowrap}
  h1{font:500 92px/1 'Fraunces',Georgia,serif;letter-spacing:-.02em;color:var(--ink);margin-bottom:20px}
  .line{font:italic 400 34px/1.18 'Fraunces',Georgia,serif;color:var(--ink);margin-bottom:34px;text-wrap:balance}
  .line em{color:var(--accent)}
  .stat{display:flex;align-items:center;gap:20px;padding-top:26px;border-top:2px solid var(--line)}
  .num{font:500 76px/0.9 'Fraunces',Georgia,serif;color:var(--accent);letter-spacing:-.02em}
  .lab{font:500 21px/1.35 'DM Sans',sans-serif;color:var(--muted)}
  .lab b{color:var(--ink);font-weight:700}
  .photo{width:520px;height:542px;border-radius:24px;object-fit:cover;object-position:50% 40%;display:block}
</style>
</head>
<body>
<div class="card">
  <div class="text">
    <div class="eyebrow">Creator and content strategist · Tel Aviv</div>
    <h1>Maya Rey</h1>
    <div class="line">UGC, ads and on-camera videos for brands, <em>from strategy to screen.</em></div>
    <div class="stat">
      <div class="num">50M+</div>
      <div class="lab">views, and <b>100+ brands</b><br>including Jetpac, Airalo<br>and Hostelworld</div>
    </div>
  </div>
  <img class="photo" src="images/hero-mid.jpg" alt="">
</div>
</body>
</html>
