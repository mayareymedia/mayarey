<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Source for images/og-image.jpg (the link preview card). Not linked from the site. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--accent:#9B1B30;--bg:#FAF5F0;--ink:#2B1A14;--muted:#6B4E40;--line:#CDAE9A}
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;background:var(--bg);overflow:hidden}
  .card{display:flex;width:1200px;height:630px;padding:48px;gap:56px}
  .text{flex:1;display:flex;flex-direction:column;justify-content:center;padding-left:24px}
  .eyebrow{font:700 19px/1.3 'DM Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
  h1{font:500 104px/1 'Fraunces',Georgia,serif;letter-spacing:-.02em;color:var(--ink);margin-bottom:26px}
  .line{font:italic 400 40px/1.15 'Fraunces',Georgia,serif;color:var(--accent);margin-bottom:30px;text-wrap:balance}
  .rule{width:72px;height:2px;background:var(--line);margin-bottom:26px}
  .what{font:400 24px/1.45 'DM Sans',sans-serif;color:var(--muted);max-width:560px}
  .photo{width:420px;height:534px;border-radius:24px;object-fit:cover;object-position:50% 38%;display:block}
</style>
</head>
<body>
<div class="card">
  <div class="text">
    <div class="eyebrow">Creator and Content Strategist · Tel Aviv</div>
    <h1>Maya Rey</h1>
    <div class="line">Short-form video, from strategy to screen.</div>
    <div class="rule"></div>
    <div class="what">UGC, ads, product videos and on-camera work, in English and Hebrew.</div>
  </div>
  <img class="photo" src="images/about.jpg" alt="">
</div>
</body>
</html>
